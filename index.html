    <!--Start of Tawk.to Script (custom black/yellow MyBoost launcher)-->
    <script type="text/javascript">
      var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

      // Keep tawk's own bubble in the corner (we hide it on load and use ours).
      Tawk_API.customStyle = {
        visibility: {
          desktop: { position: 'br', xOffset: 24, yOffset: 24 },
          mobile:  { position: 'br', xOffset: 16, yOffset: 16 }

        s0.parentNode.insertBefore(s1,s0);
      })();
    </script>

    <!-- Custom MyBoost chat launcher: black background, yellow (#FFD700) accent -->
    <style>
      #mb-chat-launcher{
        position:fixed; right:24px; bottom:24px; z-index:2147483000;
        width:60px; height:60px; padding:0; border-radius:9999px;
        border:2px solid #FFD700; background:#0a0a0a; color:#FFD700;
        cursor:pointer; display:none; align-items:center; justify-content:center;
        box-shadow:0 8px 24px rgba(0,0,0,.45);
        transition:transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
        animation:mb-chat-pulse 2.6s infinite;
      }
      #mb-chat-launcher.is-ready{ display:flex; }
      #mb-chat-launcher:hover{
        background:#FFD700; color:#0a0a0a; transform:translateY(-2px) scale(1.05);
        box-shadow:0 0 24px rgba(255,215,0,.6), 0 8px 24px rgba(0,0,0,.45);
      }
      #mb-chat-launcher:focus-visible{ outline:2px solid #FFD700; outline-offset:3px; }
      #mb-chat-launcher svg{ width:28px; height:28px; }
      @keyframes mb-chat-pulse{
        0%{ box-shadow:0 0 0 0 rgba(255,215,0,.5), 0 8px 24px rgba(0,0,0,.45); }
        70%{ box-shadow:0 0 0 14px rgba(255,215,0,0), 0 8px 24px rgba(0,0,0,.45); }
        100%{ box-shadow:0 0 0 0 rgba(255,215,0,0), 0 8px 24px rgba(0,0,0,.45); }
      }
      @media (max-width:768px){ #mb-chat-launcher{ right:16px; bottom:16px; width:54px; height:54px; } }
      @media (prefers-reduced-motion: reduce){ #mb-chat-launcher{ animation:none; } }
    </style>
    <button id="mb-chat-launcher" type="button" aria-label="Open live chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </button>
    <script type="text/javascript">
      (function(){
        var btn = document.getElementById('mb-chat-launcher');
        var hide = function(){ if (window.Tawk_API && Tawk_API.hideWidget) Tawk_API.hideWidget(); };
        var show = function(){ btn.classList.add('is-ready'); };

        Tawk_API.onLoad = function(){ hide(); show(); };
        // While the chat panel is open, our button would overlap it — hide it,
        // restore it when the chat is minimized (and re-hide tawk's bubble).
        Tawk_API.onChatMaximized = function(){ btn.classList.remove('is-ready'); };
        Tawk_API.onChatMinimized = function(){ hide(); show(); };

        btn.addEventListener('click', function(){
          if (window.Tawk_API && Tawk_API.maximize) Tawk_API.maximize();
        });
      })();
    </script>
    <!--End of Tawk.to Script-->
